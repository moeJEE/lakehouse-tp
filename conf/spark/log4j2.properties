# Journaux Spark (JupyterLab) : seuls les avertissements et les erreurs sont affichés.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# Messages sans conséquence, masqués pour garder des sorties lisibles
# (S3FileIO : avertissement interne d'Iceberg pendant le compactage, rewrite_data_files)
logger.s3fileio.name = org.apache.iceberg.aws.s3.S3FileIO
logger.s3fileio.level = error
logger.hadoop_native.name = org.apache.hadoop.util.NativeCodeLoader
logger.hadoop_native.level = error
logger.hadoop_metrics.name = org.apache.hadoop.metrics2
logger.hadoop_metrics.level = error
