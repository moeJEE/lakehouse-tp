# Journaux des jobs Spark lancés par Airflow (TP 3).
# Seuls les avertissements et les erreurs sont affichés, comme dans JupyterLab.
rootLogger.level = warn
rootLogger.appenderRef.stdout.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yy/MM/dd HH:mm:ss} %p %c{1}: %m%n%ex

# Lineage (OpenLineage) : quand Marquez ne tourne pas (parties 2 à 4), l'envoi échoue sans
# conséquence pour le job ; on masque ces messages, qui rempliraient les journaux d'Airflow.
logger.openlineage.name = io.openlineage
logger.openlineage.level = off

# Messages sans intérêt pour le cours
logger.hadoop_native.name = org.apache.hadoop.util.NativeCodeLoader
logger.hadoop_native.level = error
logger.hadoop_metrics.name = org.apache.hadoop.metrics2
logger.hadoop_metrics.level = error
