# ---- Extensions SQL : Iceberg + Delta Lake ----
spark.sql.extensions  org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,io.delta.sql.DeltaSparkSessionExtension

# ---- Catalogue Iceberg "lakehouse" (catalogue par défaut) ----
spark.sql.catalog.lakehouse                      org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.type                 rest
spark.sql.catalog.lakehouse.uri                  http://iceberg-rest:8181
spark.sql.catalog.lakehouse.warehouse            s3://lakehouse/warehouse
spark.sql.catalog.lakehouse.io-impl              org.apache.iceberg.aws.s3.S3FileIO
spark.sql.catalog.lakehouse.s3.endpoint          http://rustfs:9000
spark.sql.catalog.lakehouse.s3.path-style-access true
spark.sql.defaultCatalog                         lakehouse

# ---- Delta Lake (tables désignées par leur chemin s3a://...) ----
spark.sql.catalog.spark_catalog                  org.apache.spark.sql.delta.catalog.DeltaCatalog
spark.sql.catalogImplementation                  in-memory

# ---- Accès S3 pour Delta et les fichiers bruts (connecteur S3A) ----
spark.hadoop.fs.s3a.impl                         org.apache.hadoop.fs.s3a.S3AFileSystem
spark.hadoop.fs.s3a.endpoint                     http://rustfs:9000
spark.hadoop.fs.s3a.path.style.access            true
spark.hadoop.fs.s3a.connection.ssl.enabled       false
spark.hadoop.fs.s3a.aws.credentials.provider     com.amazonaws.auth.EnvironmentVariableCredentialsProvider

# ---- Ressources adaptées à un ordinateur portable ----
spark.driver.memory                              2g
spark.sql.shuffle.partitions                     8
spark.ui.port                                    4040

# ---- Lineage (TP 3) : chaque job Spark lancé par Airflow décrit ses entrées et ses sorties ----
# Les événements OpenLineage sont envoyés à Marquez (profil observabilite). Si Marquez ne tourne
# pas, l'envoi échoue sans arrêter le job.
spark.extraListeners                             io.openlineage.spark.agent.OpenLineageSparkListener
spark.openlineage.transport.type                 http
spark.openlineage.transport.url                  http://marquez:5000
spark.openlineage.namespace                      lakehouse
