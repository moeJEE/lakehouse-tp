# Règle d'alerte fournie (TP 3, partie 5) : au moins une exécution de DAG en échec sur 5 minutes.
# Airflow 3 n'émet plus « ti_failures » pour une tâche en échec : on compte les exécutions de DAG
# en échec (dagrun.duration.failed). « or vector(0) » : le tout premier échec est aussi compté.
apiVersion: 1
groups:
  - orgId: 1
    name: lakehouse
    folder: Lakehouse
    interval: 1m
    rules:
      - uid: tache-airflow-en-echec   # identifiant inchangé : Grafana remplace la règle existante
        title: Exécution de DAG en échec
        condition: C
        data:
          - refId: A
            relativeTimeRange: {from: 600, to: 0}
            datasourceUid: prometheus
            model:
              refId: A
              expr: >-
                (sum(airflow_execution_dag_duree_secondes_count{etat="failed"}) or vector(0))
                - (sum(airflow_execution_dag_duree_secondes_count{etat="failed"} offset 5m) or vector(0))
              instant: true
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              conditions:
                - evaluator: {type: gt, params: [0]}
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations:
          summary: Au moins une exécution de DAG a échoué dans les 5 dernières minutes.
        labels:
          equipe: data
