name: lakehouse

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
  AWS_REGION: ${AWS_REGION}
  S3_ENDPOINT: http://rustfs:9000

services:

  # ---------- Stockage objet compatible S3 ----------
  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION}
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    ports:
      - "127.0.0.1:${PORT_S3_API:-9000}:9000"
      - "127.0.0.1:${PORT_S3_CONSOLE:-9001}:9001"
    restart: unless-stopped

  # ---------- Création des buckets (s'exécute une fois puis s'arrête) ----------
  init-buckets:
    image: ${LAKEHOUSE_IMAGE}
    command: ["python", "/opt/lakehouse/scripts/init_buckets.py"]
    environment: *s3-env
    volumes:
      - ./scripts:/opt/lakehouse/scripts:ro
    depends_on:
      - rustfs
    restart: "no"

  # ---------- Catalogue Iceberg REST ----------
  iceberg-rest:
    image: apache/iceberg-rest-fixture:${ICEBERG_REST_VERSION}
    # L'image tourne en utilisateur non-root : sans cela, elle ne peut pas
    # écrire sa base SQLite dans le volume /catalog (SQLITE_CANTOPEN).
    user: root
    environment:
      <<: *s3-env
      CATALOG_WAREHOUSE: s3://lakehouse/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://rustfs:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      # Catalogue persistant (sinon il est perdu à chaque redémarrage)
      CATALOG_URI: jdbc:sqlite:file:/catalog/iceberg_catalog.db
    volumes:
      - iceberg-catalog:/catalog
    ports:
      - "127.0.0.1:${PORT_CATALOG:-8181}:8181"
    depends_on:
      init-buckets:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------- Base transactionnelle source (TP 1) ----------
  postgres:
    image: postgres:${POSTGRES_VERSION}
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PORT_POSTGRES:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---------- Poste de travail : JupyterLab + Spark + DuckDB + Streamlit ----------
  jupyter:
    image: ${LAKEHOUSE_IMAGE}
    build:
      context: ./docker/jupyter
    environment:
      <<: *s3-env
      SPARK_CONF_DIR: /opt/spark-conf
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      PG_HOST: postgres
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}
      CATALOG_URI: http://iceberg-rest:8181
      TRINO_HOST: trino
      DBT_PROFILES_DIR: /opt/dbt-profiles
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    volumes:
      - ./conf/dbt:/opt/dbt-profiles:ro
      - ./notebooks:/home/etudiant/work/notebooks
      - ./apps:/home/etudiant/work/apps
      - ./data:/home/etudiant/work/data
      - ./conf/spark:/opt/spark-conf:ro
      - ./scripts:/opt/lakehouse/scripts:ro
    ports:
      - "127.0.0.1:${PORT_JUPYTER:-8888}:8888"
      - "127.0.0.1:${PORT_SPARK_UI:-4040}:4040"
      - "127.0.0.1:${PORT_STREAMLIT:-8501}:8501"
      - "127.0.0.1:${PORT_MLFLOW:-5000}:5000"
    mem_limit: ${JUPYTER_MEM_LIMIT:-4g}
    depends_on:
      iceberg-rest:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------- Orchestration : Apache Airflow (profil orchestration, TP 3) ----------
  airflow:
    image: ${AIRFLOW_IMAGE}
    build:
      context: ./docker/airflow
    profiles: ["orchestration"]
    environment:
      <<: *s3-env
      SPARK_CONF_DIR: /opt/spark-conf
      PG_HOST: postgres
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}
      CATALOG_URI: http://iceberg-rest:8181
      DBT_PROFILES_DIR: /opt/dbt-profiles
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
      # Les DAG sont lus dans votre dossier de travail
      AIRFLOW__CORE__DAGS_FOLDER: /home/etudiant/work/notebooks/mon_travail/tp3/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: "1"          # une tâche Spark à la fois : la mémoire est limitée
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"   # pas de mot de passe en local
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
      # Supervision (profil observabilite) : métriques StatsD.
      # Si ces services ne tournent pas, Airflow fonctionne normalement.
      AIRFLOW__METRICS__STATSD_ON: "true"
      AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
      AIRFLOW__METRICS__STATSD_PORT: "9125"
      AIRFLOW__METRICS__STATSD_PREFIX: airflow
      # Le lineage vient des jobs Spark (conf/spark-airflow/spark-defaults.conf) ; le module
      # OpenLineage d'Airflow est coupé : sans Marquez, il retarderait chaque tâche.
      AIRFLOW__OPENLINEAGE__DISABLED: "true"
    volumes:
      - ./conf/dbt:/opt/dbt-profiles:ro
      - ./notebooks:/home/etudiant/work/notebooks
      - ./data:/home/etudiant/work/data
      - ./conf/spark-airflow:/opt/spark-conf:ro
      - ./scripts:/opt/lakehouse/scripts:ro
    ports:
      - "127.0.0.1:${PORT_AIRFLOW:-8085}:8080"
    mem_limit: ${AIRFLOW_MEM_LIMIT:-3g}
    depends_on:
      iceberg-rest:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------- Supervision et observabilité (profil observabilite, TP 3) ----------
  statsd-exporter:            # reçoit les métriques d'Airflow (StatsD) et les expose à Prometheus
    image: prom/statsd-exporter:${STATSD_EXPORTER_VERSION}
    profiles: ["observabilite"]
    command: ["--statsd.mapping-config=/etc/statsd/mapping.yml"]
    volumes:
      - ./conf/prometheus/statsd_mapping.yml:/etc/statsd/mapping.yml:ro
    restart: unless-stopped

  cadvisor:                   # mesure le processeur et la mémoire de chaque conteneur
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION}
    profiles: ["observabilite"]
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped

  prometheus:                 # stocke les métriques et les rend interrogeables (PromQL)
    image: prom/prometheus:${PROMETHEUS_VERSION}
    profiles: ["observabilite"]
    volumes:
      - ./conf/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PORT_PROMETHEUS:-9090}:9090"
    restart: unless-stopped

  grafana:                    # tableaux de bord et alertes sur les métriques
    image: grafana/grafana:${GRAFANA_VERSION}
    profiles: ["observabilite"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_DEFAULT_LANGUAGE: fr-FR
    volumes:
      - ./conf/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./conf/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${PORT_GRAFANA:-3000}:3000"
    depends_on: [prometheus]
    restart: unless-stopped

  init-marquez-db:            # crée la base « marquez » dans PostgreSQL (une fois, puis s'arrête)
    image: ${LAKEHOUSE_IMAGE}
    profiles: ["observabilite"]
    command: ["python", "/opt/lakehouse/scripts/init_bases.py", "marquez"]
    environment:
      PG_HOST: postgres
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}
    volumes:
      - ./scripts:/opt/lakehouse/scripts:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  marquez:                    # reçoit les événements OpenLineage : jobs, jeux de données, lineage
    image: marquezproject/marquez:${MARQUEZ_VERSION}
    profiles: ["observabilite"]
    environment:
      MARQUEZ_PORT: "5000"
      MARQUEZ_ADMIN_PORT: "5001"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: marquez
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      MARQUEZ_CONFIG: /opt/marquez/marquez.yml   # sinon : utilisateur « marquez » imposé
    volumes:
      - ./conf/marquez/marquez.yml:/opt/marquez/marquez.yml:ro
    mem_limit: 1g
    depends_on:
      init-marquez-db:
        condition: service_completed_successfully
    restart: unless-stopped

  marquez-web:                # interface web de Marquez
    image: marquezproject/marquez-web:${MARQUEZ_VERSION}
    profiles: ["observabilite"]
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: "5000"
      WEB_PORT: "3000"
    ports:
      - "127.0.0.1:${PORT_MARQUEZ:-3001}:3000"
    depends_on: [marquez]
    restart: unless-stopped

  # ---------- Moteur SQL interactif (profil sql / full) ----------
  trino:
    image: trinodb/trino:${TRINO_VERSION}
    profiles: ["sql", "full"]
    environment:
      <<: *s3-env
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}
    volumes:
      - ./conf/trino/catalog:/etc/trino/catalog:ro
    ports:
      - "127.0.0.1:${PORT_TRINO:-8080}:8080"
    mem_limit: ${TRINO_MEM_LIMIT:-2g}
    depends_on:
      - iceberg-rest
    restart: unless-stopped

  # ---------- Tableaux de bord (profil bi / full) ----------
  superset:
    image: ${SUPERSET_IMAGE}
    build:
      context: ./docker/superset
    profiles: ["bi", "full"]
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
    volumes:
      - superset-home:/app/superset_home
    ports:
      - "127.0.0.1:${PORT_SUPERSET:-8088}:8088"
    depends_on:
      - trino
    restart: unless-stopped

volumes:
  rustfs-data:
  iceberg-catalog:
  pg-data:
  superset-home:
  prometheus-data:
  grafana-data:
