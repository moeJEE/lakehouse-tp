name: lakehouse

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
  AWS_REGION: ${AWS_REGION}
  S3_ENDPOINT: http://rustfs:9000

services:

  # ---------- Stockage objet compatible S3 ----------
  rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION}
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    ports:
      - "127.0.0.1:${PORT_S3_API:-9000}:9000"
      - "127.0.0.1:${PORT_S3_CONSOLE:-9001}:9001"
    restart: unless-stopped

  # ---------- Création des buckets (s'exécute une fois puis s'arrête) ----------
  init-buckets:
    image: ${LAKEHOUSE_IMAGE}
    command: ["python", "/opt/lakehouse/scripts/init_buckets.py"]
    environment: *s3-env
    volumes:
      - ./scripts:/opt/lakehouse/scripts:ro
    depends_on:
      - rustfs
    restart: "no"

  # ---------- Catalogue Iceberg REST ----------
  iceberg-rest:
    image: apache/iceberg-rest-fixture:${ICEBERG_REST_VERSION}
    environment:
      <<: *s3-env
      CATALOG_WAREHOUSE: s3://lakehouse/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://rustfs:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
      # Catalogue persistant (sinon il est perdu à chaque redémarrage)
      CATALOG_URI: jdbc:sqlite:file:/catalog/iceberg_catalog.db
    volumes:
      - iceberg-catalog:/catalog
    ports:
      - "127.0.0.1:${PORT_CATALOG:-8181}:8181"
    depends_on:
      init-buckets:
        condition: service_completed_successfully
    restart: unless-stopped

  # ---------- Base transactionnelle source (TP 1) ----------
  postgres:
    image: postgres:${POSTGRES_VERSION}
    environment:
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${PORT_POSTGRES:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # ---------- Poste de travail : JupyterLab + Spark + DuckDB + Streamlit ----------
  jupyter:
    image: ${LAKEHOUSE_IMAGE}
    build:
      context: ./docker/jupyter
    environment:
      <<: *s3-env
      SPARK_CONF_DIR: /opt/spark-conf
      JUPYTER_TOKEN: ${JUPYTER_TOKEN}
      PG_HOST: postgres
      PG_USER: ${PG_USER}
      PG_PASSWORD: ${PG_PASSWORD}
      PG_DB: ${PG_DB}
      CATALOG_URI: http://iceberg-rest:8181
      TRINO_HOST: trino
    volumes:
      - ./notebooks:/home/etudiant/work/notebooks
      - ./apps:/home/etudiant/work/apps
      - ./data:/home/etudiant/work/data
      - ./conf/spark:/opt/spark-conf:ro
      - ./scripts:/opt/lakehouse/scripts:ro
    ports:
      - "127.0.0.1:${PORT_JUPYTER:-8888}:8888"
      - "127.0.0.1:${PORT_SPARK_UI:-4040}:4040"
      - "127.0.0.1:${PORT_STREAMLIT:-8501}:8501"
      - "127.0.0.1:${PORT_MLFLOW:-5000}:5000"
    mem_limit: ${JUPYTER_MEM_LIMIT:-4g}
    depends_on:
      iceberg-rest:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ---------- Moteur SQL interactif (profil sql / full) ----------
  trino:
    image: trinodb/trino:${TRINO_VERSION}
    profiles: ["sql", "full"]
    environment: *s3-env
    volumes:
      - ./conf/trino/catalog:/etc/trino/catalog:ro
    ports:
      - "127.0.0.1:${PORT_TRINO:-8080}:8080"
    mem_limit: ${TRINO_MEM_LIMIT:-2g}
    depends_on:
      - iceberg-rest
    restart: unless-stopped

  # ---------- Tableaux de bord (profil bi / full) ----------
  superset:
    image: ${SUPERSET_IMAGE}
    build:
      context: ./docker/superset
    profiles: ["bi", "full"]
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
    volumes:
      - superset-home:/app/superset_home
    ports:
      - "127.0.0.1:${PORT_SUPERSET:-8088}:8088"
    depends_on:
      - trino
    restart: unless-stopped

volumes:
  rustfs-data:
  iceberg-catalog:
  pg-data:
  superset-home:
